<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Book body -->
  <rect x="10" y="8" width="34" height="44" rx="4" ry="4" fill="url(#bookGrad)" opacity="0.9"/>
  <!-- Book spine -->
  <rect x="10" y="8" width="6" height="44" rx="3" ry="3" fill="url(#spineGrad)" opacity="0.95"/>
  <!-- Book page lines -->
  <line x1="22" y1="20" x2="38" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="22" y1="26" x2="38" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="22" y1="32" x2="38" y2="32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="22" y1="38" x2="32" y2="38" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Quill pen -->
  <path d="M38 10 C50 4, 58 16, 44 28 L40 44 L36 32 C30 20, 36 10 38 10Z" fill="url(#quillGrad)" opacity="0.95"/>
  <path d="M38 10 C44 8, 52 14, 44 28" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.4" fill="none"/>
  <!-- Quill tip -->
  <path d="M40 44 L36 32 L38 34Z" fill="white" opacity="0.8"/>
  <!-- Stars/sparkles -->
  <circle cx="54" cy="10" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="59" cy="18" r="1" fill="white" opacity="0.5"/>
  <circle cx="56" cy="26" r="1.2" fill="white" opacity="0.6"/>
  <defs>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="quillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
</svg>
