<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Monitor/Laptop Screen -->
  <rect x="8" y="12" width="48" height="32" rx="3" fill="url(#screenGrad)" opacity="0.9"/>
  <rect x="11" y="15" width="42" height="26" rx="1" fill="#030303" opacity="0.8"/>
  
  <!-- Stand/Base -->
  <path d="M28 44 L36 44 L38 48 L26 48 Z" fill="#4B5563" opacity="0.9"/>
  <rect x="22" y="48" width="20" height="2" rx="1" fill="#4B5563" opacity="0.9"/>

  <!-- Speaker Icon/Person in Webinar -->
  <circle cx="32" cy="24" r="5" fill="white" opacity="0.6"/>
  <path d="M22 36 C22 30, 42 30, 42 36" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Script Lines overlapping -->
  <rect x="38" y="28" width="22" height="28" rx="2" fill="url(#scriptGrad)" opacity="0.95"/>
  <line x1="42" y1="36" x2="56" y2="36" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="42" y1="42" x2="56" y2="42" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="42" y1="48" x2="50" y2="48" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Sparkles -->
  <circle cx="58" cy="15" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="54" cy="8" r="0.8" fill="white" opacity="0.5"/>

  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="scriptGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
</svg>
